unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind -r M-Up    resize-pane -U 5
bind -r M-Down  resize-pane -D 5
bind -r M-Left  resize-pane -L 5
bind -r M-Right resize-pane -R 5

# Status bar: CPU, memory, and time on the bottom right.
set -ga terminal-overrides ",*256col*:Tc"
set -g escape-time 10
set -g default-terminal "screen-256color"

set -g status-style "bg=#1b1b1b,fg=#808080"
set -g status-left-length 30
set -g status-left "#[bg=#a17af8,fg=#1b1b1b,bold] #S #[default] "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#a17af8,bold] #I:#W #[default]"
set -g mouse on
set -g status-position bottom
set -g status-interval 5
set -g status-right-length 80
set -g status-right '#[fg=#808080] %H:%M:%S  #[bg=#a17af8,fg=#1b1b1b,bold] #(bash "$(dirname "$(realpath "$HOME/.tmux.conf")")/status.sh") #[default]'
